name: Container images

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - gateway
          - auth-service
          - organization-service
          - academic-service
          - billing-service
          - notification-service
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/${{ matrix.service }}/Dockerfile
          push: false
          load: true
          tags: lms-${{ matrix.service }}:scan
          cache-from: type=gha,scope=${{ matrix.service }}

      - name: Scan image for known vulnerabilities
        uses: aquasecurity/trivy-action@0.29.0
        with:
          image-ref: lms-${{ matrix.service }}:scan
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

  push-scanned:
    if: github.event_name == 'push'
    needs: build-scan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - gateway
          - auth-service
          - organization-service
          - academic-service
          - billing-service
          - notification-service
    permissions:
      contents: read
      packages: write
      actions: read
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push scanned image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/lms-${{ matrix.service }}:sha-${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/lms-${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
