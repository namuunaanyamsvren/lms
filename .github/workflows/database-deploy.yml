name: Deploy database migrations

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Protected GitHub environment containing database URLs
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

concurrency:
  group: database-migrations-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --prefix backend
      - run: npm run prisma:generate --prefix backend
      - name: Auth schema — forward-only deploy
        working-directory: backend/auth-service
        env:
          DATABASE_URL: ${{ secrets.AUTH_DATABASE_URL }}
        run: npm run prisma:deploy
      - name: Organization schema — forward-only deploy
        working-directory: backend/organization-service
        env:
          DATABASE_URL: ${{ secrets.ORGANIZATION_DATABASE_URL }}
        run: npm run prisma:deploy
      - name: Billing schema — forward-only deploy
        working-directory: backend/billing-service
        env:
          DATABASE_URL: ${{ secrets.BILLING_DATABASE_URL }}
        run: npm run prisma:deploy
      - name: Notification schema — forward-only deploy
        working-directory: backend/notification-service
        env:
          DATABASE_URL: ${{ secrets.NOTIFICATION_DATABASE_URL }}
        run: npm run prisma:deploy
      - name: Academic schema — forward-only deploy
        working-directory: backend/academic-service
        env:
          DATABASE_URL: ${{ secrets.ACADEMIC_DATABASE_URL }}
        run: npm run prisma:deploy
