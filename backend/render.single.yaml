# Single-service Render Blueprint for LMS demo/staging.
#
# Use this instead of render.yaml when the goal is a stable demo deployment:
# one public gateway service runs the auth, organization, academic and
# notification services as localhost processes inside the same container.

databases:
  - name: lms-postgres-single
    databaseName: lms_db
    plan: free
    region: oregon

services:
  - type: redis
    name: lms-redis-single
    plan: free
    region: oregon
    ipAllowList: []

  - type: web
    name: lms-backend-single
    runtime: docker
    plan: free
    region: oregon
    rootDir: backend
    dockerfilePath: ./single-service/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: staging
      - key: PORT
        value: "8000"
      - key: FEATURE_BILLING_ENABLED
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: lms-postgres-single
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: lms-redis-single
          property: connectionString
      - key: RABBITMQ_URL
        sync: false
      - key: ACCESS_TOKEN_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRES_IN
        value: 15m
      - key: REFRESH_TOKEN_EXPIRES_IN
        value: 7d
      - key: REFRESH_COOKIE_NAME
        value: lms_refresh
      - key: REFRESH_COOKIE_PATH
        value: /api/v1/auth
      - key: REFRESH_COOKIE_SAME_SITE
        value: none
      - key: CSRF_COOKIE_NAME
        value: lms_csrf
      - key: CSRF_HEADER_NAME
        value: x-csrf-token
      - key: CSRF_SECRET
        generateValue: true
      - key: SERVICE_TOKEN_SECRET
        generateValue: true
      - key: PHONE_OTP_HASH_SECRET
        generateValue: true
      - key: SMS_PROVIDER
        value: mock
      - key: FRONTEND_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: TENANT_BASE_DOMAIN
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: FILE_SIGNING_SECRET
        generateValue: true
      - key: FILE_DOWNLOAD_BASE_URL
        sync: false
      - key: FILE_STORAGE_DIRECTORY
        value: /data/private-uploads
      - key: FILE_STORAGE_AT_REST_ENCRYPTED
        value: "false"
      - key: MALWARE_SCAN_MODE
        value: disabled
