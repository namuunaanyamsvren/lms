# Single-service Render Blueprint for LMS demo/staging.
#
# This blueprint intentionally does not create a new free Postgres or Key Value
# resource. Render allows only one active free-tier database and one free-tier
# Key Value instance per account, so reuse the existing resources by pasting
# their connection strings into DATABASE_URL and REDIS_URL during setup.

services:
  - type: web
    name: lms-backend-single
    runtime: docker
    plan: free
    region: oregon
    rootDir: backend
    dockerfilePath: ./single-service/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: staging
      - key: PORT
        value: "8000"
      - key: FEATURE_BILLING_ENABLED
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: ACCESS_TOKEN_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRES_IN
        value: 15m
      - key: REFRESH_TOKEN_EXPIRES_IN
        value: 7d
      - key: REFRESH_COOKIE_NAME
        value: lms_refresh
      - key: REFRESH_COOKIE_PATH
        value: /api/v1/auth
      - key: REFRESH_COOKIE_SAME_SITE
        value: none
      - key: CSRF_COOKIE_NAME
        value: lms_csrf
      - key: CSRF_HEADER_NAME
        value: x-csrf-token
      - key: CSRF_SECRET
        generateValue: true
      - key: SERVICE_TOKEN_SECRET
        generateValue: true
      - key: PHONE_OTP_HASH_SECRET
        generateValue: true
      - key: SMS_PROVIDER
        value: mock
      - key: FRONTEND_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: TENANT_BASE_DOMAIN
        sync: false
      - key: FILE_SIGNING_SECRET
        generateValue: true
      - key: FILE_STORAGE_DIRECTORY
        value: /data/private-uploads
      - key: FILE_STORAGE_AT_REST_ENCRYPTED
        value: "false"
      - key: MALWARE_SCAN_MODE
        value: disabled
