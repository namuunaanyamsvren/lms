      - key: ACCESS_TOKEN_SECRET
        fromService:
          type: web
          name: lms-gateway
          envVarKey: ACCESS_TOKEN_SECRET
      - key: SERVICE_TOKEN_SECRET
        fromService:
          type: web
          name: lms-auth-service
          envVarKey: SERVICE_TOKEN_SECRET
      - key: ALLOWED_ORIGINS
        fromService:
          type: web
          name: lms-gateway
          envVarKey: ALLOWED_ORIGINS
      - key: AUTH_SERVICE_URL
        fromService:
          type: web
          name: lms-auth-service
          envVarKey: RENDER_EXTERNAL_URL
      - key: BILLING_SERVICE_URL
        fromService:
          type: web
          name: lms-billing-service
          envVarKey: RENDER_EXTERNAL_URL
      - key: NOTIFICATION_SERVICE_URL
        fromService:
          type: web
          name: lms-notification-service
          envVarKey: RENDER_EXTERNAL_URL
      - key: FEATURE_BILLING_ENABLED
        value: "false"
      - key: FILE_SIGNING_SECRET
        generateValue: true
      - key: FILE_DOWNLOAD_BASE_URL
        fromService:
          type: web
          name: lms-gateway
          envVarKey: RENDER_EXTERNAL_URL
      - key: FILE_STORAGE_DIRECTORY
        value: /data/private-uploads
      - key: FILE_STORAGE_AT_REST_ENCRYPTED
        value: "false"
      - key: MALWARE_SCAN_MODE
        value: disabled

