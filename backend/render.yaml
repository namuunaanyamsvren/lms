          name: lms-redis
          property: connectionString
      - key: RABBITMQ_URL
        fromService:
          type: web
          name: lms-auth-service
          envVarKey: RABBITMQ_URL
      - key: ACCESS_TOKEN_SECRET
        fromService:
          type: web
          name: lms-gateway
          envVarKey: ACCESS_TOKEN_SECRET
      - key: SERVICE_TOKEN_SECRET
        fromService:
          type: web
          name: lms-auth-service
          envVarKey: SERVICE_TOKEN_SECRET
      - key: ALLOWED_ORIGINS
        fromService:
          type: web
          name: lms-gateway
          envVarKey: ALLOWED_ORIGINS
      - key: TENANT_BASE_DOMAIN
        fromService:
          type: web
          name: lms-gateway
          envVarKey: TENANT_BASE_DOMAIN
      - key: AUTH_SERVICE_URL
        fromService:
          type: web
          name: lms-auth-service
          envVarKey: RENDER_EXTERNAL_URL
      - key: ACADEMIC_SERVICE_URL
        fromService:
          type: web
          name: lms-academic-service
          envVarKey: RENDER_EXTERNAL_URL
      - key: BILLING_SERVICE_URL
        fromService:
          type: web
          name: lms-billing-service
          envVarKey: RENDER_EXTERNAL_URL
      - key: NOTIFICATION_SERVICE_URL
        fromService:
          type: web
          name: lms-notification-service
          envVarKey: RENDER_EXTERNAL_URL
      - key: FEATURE_BILLING_ENABLED
        value: "false"

