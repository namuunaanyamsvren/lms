# Local maintenance inside the database container.
local   all             all                                     trust
# Application and administrative connections require SCRAM passwords.
host    all             all             0.0.0.0/0               scram-sha-256
host    all             all             ::/0                    scram-sha-256
# pg_basebackup uses the replication protocol.
host    replication     all             0.0.0.0/0               scram-sha-256
host    replication     all             ::/0                    scram-sha-256
