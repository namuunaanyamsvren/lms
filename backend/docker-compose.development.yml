# Local development only. Bind infrastructure to loopback so host-based tests
# can connect without exposing these services on the LAN.
services:
  postgres:
    ports:
      - "127.0.0.1:5432:5432"
  redis:
    ports:
      - "127.0.0.1:6379:6379"
  rabbitmq:
    ports:
      - "127.0.0.1:${RABBITMQ_HOST_PORT:-5673}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_HOST_PORT:-15673}:15672"
